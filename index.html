<!DOCTYPE html>
<html lang="en" style="--accent: #5865f2;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235b6ee1'%3E%3Cpath d='m12 2 8 4.6v10.8L12 22l-8-4.6V6.6L12 2Zm0 3.1L6.8 8 12 11l5.2-3L12 5.1Z'/%3E%3C/svg%3E">
<script src="https://cdn.pubnub.com/sdk/javascript/pubnub.4.37.0.min.js"></script>
<style>
  :root{
    --bg-deep:#1e1f22; --bg-sidebar:#2b2d31; --bg-chat:#313338; --bg-input:#383a40;
    --bg-hover:#3f4248; --bg-active:#404249; --text:#dbdee1; --muted:#949ba4; --muted-dark:#80848e;
    --accent:#5865f2; --green:#23a559; --red:#f23f43; --yellow:#f0b232; --border:#26282c; --msg-hover:#2e3035;
    --panel-bg:#232428; --modal-bg:#1e1f22; --overlay:rgba(0,0,0,.65);
  }
  body.theme-light{
    --bg-deep:#e3e5e8; --bg-sidebar:#f2f3f5; --bg-chat:#ffffff; --bg-input:#e8e9eb;
    --bg-hover:#e8e9eb; --bg-active:#e3e5e8; --text:#313338; --muted:#6d6f78; --muted-dark:#95989f;
    --border:#d5d7db; --msg-hover:#f4f5f7; --panel-bg:#e3e5e8; --modal-bg:#ffffff; --overlay:rgba(0,0,0,.35);
  }
  body.theme-midnight{
    --bg-deep:#0b0d12; --bg-sidebar:#10131a; --bg-chat:#141824; --bg-input:#1a1f2d;
    --bg-hover:#1f2534; --bg-active:#232a3d; --text:#e6e9f2; --muted:#8b93a7; --muted-dark:#6d748a;
    --border:#1d2331; --msg-hover:#181e2c; --panel-bg:#0d1017; --modal-bg:#10131a; --overlay:rgba(0,0,0,.7);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'gg sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg-deep);color:var(--text);overflow:hidden;font-size:15px}
  .hidden{display:none !important}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
  svg{display:block}
  a{color:var(--accent)}


  #login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#1a1b1e;overflow:hidden}
  #login .blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
  #login .b1{width:420px;height:420px;background:#5865f2;top:-120px;left:-80px}
  #login .b2{width:380px;height:380px;background:#eb459e;bottom:-140px;right:-60px}
  .login-card{position:relative;width:min(430px,92vw);background:#313338;border-radius:8px;padding:32px;box-shadow:0 8px 40px rgba(0,0,0,.5);text-align:center}
  .login-card .logo{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#5865f2,#eb459e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800}
  .login-card h1{font-size:24px;font-weight:800;margin-bottom:4px}
  .login-card p.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .field{text-align:left;margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}
  .field input,.field textarea{width:100%;background:#1e1f22;border:1px solid #1e1f22;border-radius:4px;color:var(--text);padding:10px 12px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .avatars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .avatars .dot{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .1s}
  .avatars .dot.sel{border-color:#fff;transform:scale(1.12)}
  .btn-primary{width:100%;background:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:12px;border-radius:4px;margin-top:8px;transition:background .15s}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .login-card .fine{color:var(--muted-dark);font-size:11px;margin-top:14px}
  .admin-links{display:flex;gap:8px;margin-top:12px}.admin-link{flex:1;padding:9px 8px;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;font-weight:600;text-align:center}.admin-link:hover{background:var(--bg-hover)}

  /* Nexus icon rework — consistent community-chat line icon language */
  .n-icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
  .login-card .logo .n-icon{width:38px;height:38px;stroke-width:1.5}
  #servers{background:#181a20;padding:14px 0;gap:10px;border-right:1px solid rgba(255,255,255,.035)}
  .srv{background:#252831;border:1px solid rgba(255,255,255,.06);box-shadow:0 3px 9px rgba(0,0,0,.14)}
  .srv:hover{background:linear-gradient(135deg,#6576ec,#5865f2);box-shadow:0 5px 15px rgba(88,101,242,.28)}
  .srv.active{background:linear-gradient(135deg,#6576ec,#5865f2);box-shadow:0 5px 15px rgba(88,101,242,.28)}
  .srv .n-icon{width:23px;height:23px}.srv-add,.srv-compass{background:#252831;color:#9aa7ff}.srv-compass:hover{background:#5b6ee1;color:#fff;transform:none}
  #channels{background:#20232b}.srv-head{box-shadow:0 1px 0 rgba(255,255,255,.055)}
  .icon-btn{border-radius:7px;transition:background .15s,color .15s,transform .15s}.icon-btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
  .icon-btn .n-icon{width:20px;height:20px}.head-right{gap:4px}.head-right .icon-btn{width:34px;height:34px}.head-right .icon-btn .n-icon{width:19px;height:19px}
  #input-wrap{border:1px solid rgba(255,255,255,.055);box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .plus-btn{border-radius:8px}.plus-btn .n-icon{width:22px;height:22px}


  #app{display:flex;height:100vh}
  #app.fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}


  #servers{width:72px;background:var(--bg-deep);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;flex-shrink:0}
  #servers::-webkit-scrollbar{width:0}
  .srv{width:48px;height:48px;border-radius:24px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:border-radius .15s,background .15s,color .15s}
  .srv .pill{position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:8px;background:#fff;border-radius:0 4px 4px 0;transition:height .15s}
  .srv:hover{border-radius:16px;background:var(--accent);color:#fff}
  .srv.active{background:var(--accent);color:#fff;border-radius:16px}
  .srv.active .pill{height:36px}
  .srv .tooltip{position:absolute;left:58px;top:50%;transform:translateY(-50%);background:#111214;color:#fff;padding:7px 11px;border-radius:4px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .srv:hover .tooltip{opacity:1}
  .srv .tooltip::before{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:#111214}
  .srv .badge{position:absolute;bottom:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg-deep);padding:0 3px}
  .srv-add{background:#313338;border-radius:24px;color:var(--green);font-size:22px;line-height:1}
  .srv-add:hover{background:var(--green);color:#fff}
  .srv-compass{background:#313338;border-radius:24px;color:var(--green)}
  .srv-compass:hover{background:var(--green);color:#fff;border-radius:16px;transform:rotate(180deg)}
  .divider{width:32px;height:2px;background:#35363c;border-radius:1px;flex-shrink:0;margin:2px 0}


  #channels{width:240px;background:var(--bg-sidebar);display:flex;flex-direction:column;flex-shrink:0;min-width:0}
  .srv-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 1px 0 var(--border);cursor:pointer;flex-shrink:0}
  .srv-head:hover{background:rgba(255,255,255,.02)}
  .srv-head h2{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srv-head .chev{color:var(--muted);font-size:12px}
  .chan-list{flex:1;overflow-y:auto;padding:8px 8px 12px}
  .chan-list::-webkit-scrollbar{width:6px}
  .chan-list::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:3px}
  .cat{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 4px 4px;color:var(--muted-dark);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
  .cat:hover{color:var(--muted)}
  .cat .carrot{font-size:9px}
  .cat .add{opacity:0;font-size:14px;color:var(--muted);line-height:1;border:none;background:none}
  .cat:hover .add{opacity:1}
  .cat .add:hover{color:#fff}
  .chan{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:2px}
  .chan:hover{background:var(--bg-hover);color:var(--text)}
  .chan.active{background:var(--bg-active);color:#fff}
  .chan .icon{width:20px;display:flex;justify-content:center;flex-shrink:0}
  .chan .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
  .chan .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .voice .name{font-size:14px}
  .vc-users{padding:0 4px 8px 36px;display:flex;flex-direction:column;gap:4px}
  .vc-user{display:flex;align-items:center;gap:6px;color:#2dc770;font-size:13px;font-weight:500;padding:3px 6px;border-radius:4px;cursor:pointer}
  .vc-user:hover{background:var(--bg-hover);color:#fff}
  .vc-user svg{width:14px;height:14px}
  .convo{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;color:var(--muted);cursor:pointer}
  .convo:hover{background:var(--bg-hover);color:var(--text)}
  .convo.active{background:var(--bg-active);color:#fff}
  .convo .mname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .dm-search{display:flex;align-items:center;gap:6px;background:var(--bg-input);border-radius:4px;margin:0 8px 8px;padding:0 8px;color:var(--muted)}
  .dm-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:inherit;padding:7px 0;min-width:0}
  .dm-search input::placeholder{color:var(--muted-dark)}


  .user-panel{height:52px;background:var(--panel-bg);display:flex;align-items:center;gap:8px;padding:0 8px;flex-shrink:0;position:relative}
  .user-panel .me{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;padding:4px;border-radius:4px}
  .user-panel .me:hover{background:var(--bg-hover)}
  .avatar{position:relative;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;user-select:none}
  .av-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .me .avatar{width:32px;height:32px;font-size:13px}
  .me .uname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .usub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:#23a559;border:2.5px solid var(--panel-bg)}
  .status-dot.idle{background:var(--yellow)}
  .status-dot.dnd{background:var(--red)}
  .status-dot.off{background:#80848e}
  .icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted);position:relative}
  .icon-btn:hover{background:var(--bg-hover);color:#fff}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.muted svg{opacity:.4}
  .icon-btn .slash{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--red);border-radius:2px;display:none}
  .icon-btn.muted .slash{display:block}
  .coin-chip{display:flex;align-items:center;gap:4px;background:var(--bg-hover);border-radius:12px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--yellow);flex-shrink:0}
  .coin-chip:hover{background:var(--bg-active);color:#fff}
  .nitro-badge{display:inline-block;margin-left:3px;font-size:.85em;filter:drop-shadow(0 0 3px #ff73fa);vertical-align:middle}
  .nitro-card{background:linear-gradient(135deg,#5865f2,#eb459e);border:none}
  .nitro-card h4,.nitro-card .fx-desc{color:#fff}
  .nitro-perks{list-style:none;margin:4px 0 0;padding:0;font-size:12px;color:rgba(255,255,255,.9);display:flex;flex-direction:column;gap:3px}
  .nitro-perks li::before{content:'✓ ';font-weight:900}


  #chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-chat)}
  #chat-head{height:48px;display:flex;align-items:center;gap:6px;padding:0 12px;box-shadow:0 1px 0 var(--border);flex-shrink:0}
  .head-hash{color:var(--muted);font-size:20px;margin-right:2px}
  .head-title{font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-title:hover{color:#fff}
  .head-topic{color:var(--muted);font-size:13px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:2px}
  .head-right .icon-btn{padding:6px}
  .head-right .icon-btn svg{width:22px;height:22px}
  .head-right .gift{color:#f0b232}
  .head-right .gift:hover{color:#fff;background:var(--bg-hover)}
  .head-right .call{color:#2dc770}
  .head-right .call:hover{color:#fff;background:var(--bg-hover)}


  #messages{flex:1;overflow-y:auto;padding:18px 12px 8px 16px;position:relative;transition:background .2s}
  #messages::-webkit-scrollbar{width:8px}
  #messages::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}
  .welcome{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 20px}
  .day-divider{display:flex;align-items:center;gap:10px;margin:18px 0 10px;color:var(--muted-dark);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .day-divider::before,.day-divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .msg{position:relative;display:flex;gap:14px;padding:3px 48px 3px 0;border-radius:6px;animation:msgIn .2s ease}
  .msg:hover{background:var(--msg-hover)}
  .msg+.msg{margin-top:1px}
  .msg.gap{margin-top:14px}
  body.compact .msg{padding-top:1px;padding-bottom:1px}
  body.compact .msg .avatar{width:32px;height:32px;font-size:12px}
  body.compact .msg .top{margin-bottom:0}
  @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg .avatar{width:40px;height:40px;font-size:15px;margin-top:2px}
  .msg-body{flex:1;min-width:0}
  .msg .top{display:flex;align-items:baseline;gap:8px;margin-bottom:1px}
  .msg .name{font-weight:600;cursor:pointer}
  .msg .name:hover{text-decoration:underline}
  .msg .time{font-size:11px;color:var(--muted-dark)}
  .msg .content{font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;color:var(--text)}
  .msg .content b{font-weight:700}
  .msg .content i{font-style:italic}
  .msg .content code.inline{background:#1e1f22;border-radius:4px;padding:1px 5px;font-family:Menlo,Consolas,monospace;font-size:13px;color:#ff7d7d}
  .msg .content pre.codeblock{background:#1e1f22;border-radius:6px;padding:10px 12px;margin:6px 0;overflow-x:auto}
  .msg .content pre.codeblock code{font-family:Menlo,Consolas,monospace;font-size:13px;color:#dcdcaa}
  .msg .content blockquote{border-left:4px solid var(--accent);padding-left:10px;margin:4px 0;color:var(--muted)}
  .msg .content .mention{background:rgba(88,101,242,.25);color:#aab5ff;border-radius:4px;padding:0 3px;font-weight:600}
  .msg .content .mention.known{background:rgba(88,101,242,.55);color:#fff;cursor:pointer}
  .msg .content a{text-decoration:none}
  .msg .content a:hover{text-decoration:underline}
  /* Message Skins — a shop category that changes the presentation of each sent message */
  .msg[class*="msg-skin-"] .msg-body{padding:7px 10px;border-radius:10px;position:relative}
  .msg.msg-skin-bubble .msg-body{background:linear-gradient(135deg,rgba(114,137,218,.28),rgba(114,137,218,.08));border:1px solid rgba(170,181,255,.34);border-bottom-left-radius:3px}
  .msg.msg-skin-postcard .msg-body{background:repeating-linear-gradient(0deg,rgba(255,216,137,.055) 0 1px,transparent 1px 24px),#2b2928;border:1px solid #a88758;border-radius:3px;box-shadow:inset 0 0 0 3px rgba(255,216,137,.06)}
  .msg.msg-skin-postcard .msg-body::before{content:'✦ POSTCARD';display:block;color:#e7bf76;font-size:9px;letter-spacing:1.2px;font-weight:800;margin-bottom:3px}
  .msg.msg-skin-signal .msg-body{background:#07180f;border:1px solid #2cbe68;border-radius:2px;box-shadow:0 0 12px rgba(44,190,104,.14);font-family:Menlo,Consolas,monospace}
  .msg.msg-skin-signal .msg-body .content{color:#a5f5bd}
  .msg.msg-skin-aurora .msg-body{background:linear-gradient(115deg,rgba(50,235,177,.17),rgba(111,98,255,.22),rgba(255,99,203,.14));border:1px solid rgba(154,171,255,.38);box-shadow:0 0 15px rgba(87,171,255,.10)}
  .msg.msg-skin-arcade .msg-body{background:#171327;border:2px solid #ff5ac8;border-radius:2px;box-shadow:3px 3px 0 #5ce1e6}
  .msg.msg-skin-arcade .msg-body .content{font-family:Menlo,Consolas,monospace}
  .msg.msg-skin-paper .msg-body{background:#efe4b5;color:#362d1e;border-radius:2px;box-shadow:2px 3px 0 rgba(0,0,0,.22);transform:rotate(-.25deg)}
  .msg.msg-skin-paper .msg-body .content,.msg.msg-skin-paper .msg-body .time{color:#493b25}
  .msg.msg-skin-paper .msg-body .name{color:#725327!important}
  .msg.msg-skin-holo .msg-body{background:linear-gradient(110deg,rgba(0,229,255,.15),rgba(255,110,196,.17),rgba(167,255,128,.13));background-size:250% 100%;border:1px solid rgba(213,236,255,.44);box-shadow:0 0 14px rgba(0,229,255,.12);animation:skinHolo 4s linear infinite}
  .msg.msg-skin-seal .msg-body{background:linear-gradient(135deg,#3b2d10,#211b12);border:1px solid #e9c45d;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(233,196,93,.16),0 0 11px rgba(233,196,93,.13)}
  .msg.msg-skin-confetti .msg-body{background:linear-gradient(115deg,rgba(255,98,178,.17),rgba(88,101,242,.18));border:1px solid rgba(255,170,218,.32);overflow:hidden}
  .msg.msg-skin-confetti .msg-body::before{content:'✦  •  ✦  •  ✦  •  ✦';position:absolute;right:8px;top:3px;color:rgba(255,213,103,.6);font-size:9px;letter-spacing:5px;pointer-events:none}
  .msg.msg-skin-blueprint .msg-body{background-color:#102b45;background-image:linear-gradient(rgba(109,213,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(109,213,255,.09) 1px,transparent 1px);background-size:14px 14px;border:1px solid #63c9f4;border-radius:2px}
  .msg.msg-skin-blueprint .msg-body .content{color:#bdefff}
  @keyframes skinHolo{to{background-position:250% 0}}
  .you-badge{margin-left:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;vertical-align:middle}
  .edited-note{font-size:11px;color:var(--muted-dark);font-style:italic}
  .pin-badge{display:inline-flex;align-items:center;gap:3px;color:var(--yellow);font-size:10px;margin-left:8px;vertical-align:middle}
  .mdisc{font-size:11px;color:var(--muted-dark);font-weight:500;margin-left:5px}
  .att-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .att{max-width:300px;max-height:260px;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--border)}
  .att-fig{display:flex;flex-direction:column;gap:2px}
  .att-cap{font-size:11px;color:var(--muted-dark);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- rich content: stickers / GIFs / gifts ---- */
  .sticker{font-size:72px;line-height:1;margin:2px 0 4px;animation:stickerPop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes stickerPop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .gif-emoji{font-size:64px;line-height:1;margin:2px 0 4px;display:inline-block}
  .fx-gif-bounce{animation:gifBounce 1s ease-in-out infinite}
  .fx-gif-spin{animation:gifSpin 1.6s linear infinite}
  .fx-gif-pulse{animation:gifPulse 1.2s ease-in-out infinite}
  .fx-gif-shake{animation:gifShake .5s ease-in-out infinite}
  .fx-gif-wiggle{animation:gifWiggle 1s ease-in-out infinite}
  .fx-gif-float{animation:gifFloatEmoji 2s ease-in-out infinite}
  .fx-gif-rainbow{animation:gifRainbow 2s linear infinite}
  .fx-gif-zoom{animation:gifZoom 1.4s ease-in-out infinite}
  @keyframes gifBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes gifSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes gifPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  @keyframes gifShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes gifWiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes gifFloatEmoji{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(6deg)}}
  @keyframes gifRainbow{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
  @keyframes gifZoom{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .gift-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(240,178,50,.14),rgba(240,178,50,.04));border:1px solid rgba(240,178,50,.35);border-radius:10px;padding:12px 16px;max-width:340px;margin-top:4px;position:relative;overflow:hidden}
  .gift-card::after{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:giftShine 2.6s infinite}
  @keyframes giftShine{0%{left:-60%}60%,100%{left:140%}}
  .gift-emoji{font-size:40px;line-height:1;animation:giftFloat 1.6s ease-in-out infinite;display:inline-block}
  @keyframes giftFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  .gift-info{min-width:0}
  .gift-name{font-size:15px;font-weight:800;color:var(--yellow)}

  .gift-target{display:flex;align-items:center;gap:7px;flex:0 0 auto;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--text);cursor:pointer;transition:border-color .1s,background .1s,transform .1s}
  .gift-target:hover{border-color:var(--accent);transform:translateY(-1px)}
  .gift-target.selected{border-color:var(--accent);background:rgba(88,101,242,.2);box-shadow:0 0 0 1px var(--accent)}
  .gift-target .avatar{width:28px;height:28px;font-size:11px}

  .gift-target-empty{background:var(--bg-input);border:1px dashed var(--border);border-radius:8px;padding:10px;color:var(--muted);font-size:12px;margin-bottom:10px}

  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:52vh;overflow-y:auto}

  .pick-cell{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:10px 6px;cursor:pointer;transition:border-color .1s,transform .1s}

  #typing{display:flex;align-items:center;gap:8px;padding:6px 20px;color:var(--muted);font-size:13px;min-height:24px}

  #typing .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}


  #composer{padding:0 16px 22px;flex-shrink:0;position:relative;transition:background .2s}
  .reply-bar{display:flex;align-items:center;gap:10px;background:var(--bg-input);border-top:2px solid var(--accent);border-radius:8px 8px 0 0;padding:8px 14px;font-size:13px;color:var(--muted)}

  #composer textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);resize:none;font-family:inherit;font-size:15px;line-height:1.4;padding:12px 2px;max-height:220px;min-height:40px}

  .in-btns{display:flex;align-items:center;flex-shrink:0}

  .in-btns .icon-btn svg{width:22px;height:22px}
  .in-btns .gif-btn{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);padding:4px 6px;border-radius:4px;line-height:1}
  .in-btns .gif-btn:hover{color:#fff;background:var(--bg-hover)}
  #messages.drag-over{outline:3px dashed var(--accent);outline-offset:-8px;background:rgba(88,101,242,.07)}
  #composer.drag-over{outline:3px dashed var(--accent);outline-offset:-6px;background:rgba(88,101,242,.06)}
  .mute-note{display:flex;align-items:center;gap:7px;background:rgba(242,63,67,.16);border:1px solid rgba(242,63,67,.45);border-radius:8px 8px 0 0;color:#ffb5b7;padding:8px 11px;font-size:12px;font-weight:700}

  .jump-btn{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:var(--bg-active);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none;z-index:20;border:1px solid var(--border)}

  #members{width:240px;background:var(--bg-sidebar);overflow-y:auto;flex-shrink:0;padding:14px 8px}
  #members::-webkit-scrollbar{width:6px}
  #members::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:3px}
  .mem-section{color:var(--muted-dark);font-size:11px;font-weight:700;letter-spacing:.4px;padding:12px 8px 6px;display:flex;justify-content:space-between;align-items:center}
  .mem-section .mcount{color:var(--muted-dark);font-weight:500}
  .member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:pointer}
  .member:hover{background:var(--bg-hover)}
  .member .avatar{width:32px;height:32px;font-size:13px}
  .member .status-dot{border-color:var(--bg-sidebar)}
  .member .mname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member .mstatus{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .member-search{display:flex;align-items:center;gap:6px;background:var(--bg-input);border-radius:4px;margin:0 8px 8px;padding:0 8px;color:var(--muted)}
  .member-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:inherit;padding:7px 0;min-width:0}
  .member-search input::placeholder{color:var(--muted-dark)}


  .pop{position:fixed;z-index:120;background:var(--modal-bg);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:popIn .12s ease;min-width:170px;border:1px solid var(--border)}
  @keyframes popIn{from{opacity:0;transform:scale(.95) translateY(4px)}to{opacity:1;transform:none}}
  .pop .pop-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;font-size:14px;cursor:pointer;color:var(--text)}

  .pop .pop-item.danger{color:var(--red)}
  .pop .pop-item.danger:hover{background:var(--red);color:#fff}
  .pop .pop-item svg{width:16px;height:16px}
  .pop .pop-sep{height:1px;background:var(--border);margin:4px 0}
  .emoji-row{display:flex;gap:2px}
  .emoji-row .em{font-size:20px;padding:3px;border-radius:4px;cursor:pointer;line-height:1}
  .emoji-row .em:hover{background:var(--bg-hover);transform:scale(1.15)}

  .emoji-cats .em.on{opacity:1;background:var(--bg-hover)}


  /* ---- shop ---- */
  .shop-bal{font-size:14px;color:var(--text);background:var(--bg-input);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .shop-bal .how{font-size:11px;color:var(--muted-dark);margin-left:auto}

  /* ---- Play Together activities ---- */
  .activity-hero{background:linear-gradient(135deg,rgba(88,101,242,.28),rgba(235,69,158,.16));border:1px solid rgba(140,151,255,.32);border-radius:10px;padding:14px;margin-bottom:14px}

  .activity-upload-row .btn{font-size:11px;padding:6px 9px}

  .activity-game-frame:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,101,242,.32)}
  /* Deliberately use a layout fullscreen mode instead of the browser Fullscreen API.
     Browsers reserve Escape to leave native fullscreen; this keeps Escape available
     to the game inside the shared iframe on every supported desktop browser. */
  #activity-view.activity-layout-fullscreen{position:fixed;inset:0;z-index:10001;box-sizing:border-box;width:100vw;height:100vh;overflow:auto;padding:24px;background:var(--modal-bg)}

  .tap-target:hover{transform:scale(1.06)} .tap-target:active{transform:scale(.93)} .tap-target:disabled{filter:grayscale(1);opacity:.55;cursor:default}
  .dice-roll{font-size:44px;line-height:1;margin:12px 0 4px;min-height:48px}.dice-roll.roll{animation:diceRoll .35s ease}
  @keyframes diceRoll{50%{transform:rotate(18deg) scale(1.35)}}
  .emoji-choices{display:flex;justify-content:center;gap:8px;margin:12px 0}.emoji-choice{font-size:27px;background:var(--bg-hover);border:1px solid var(--border);border-radius:8px;width:54px;height:50px}.emoji-choice:hover{transform:translateY(-2px);border-color:var(--accent)}.emoji-choice:disabled{opacity:.45;cursor:default}

const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const shade = hex => { const n=parseInt(hex.slice(1),16); const r=Math.max(0,(n>>16)-30),g=Math.max(0,((n>>8)&255)-30),b=Math.max(0,(n&255)-30); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); };
const avatarHTML = (name,color,sizeCls,avatar,fx) =>
  '<div class="avatar ' + (sizeCls||'') + ' ' + (fx||'') + '" style="background:linear-gradient(135deg,' + color + ',' + shade(color) + ')">' +
  (avatar ? '<img class="av-img" src="' + avatar + '" alt="">' : esc((name||'?')[0].toUpperCase())) + '</div>';
const el = cls => { const d=document.createElement('div'); d.className=cls; return d; };
const debounce = (fn,ms) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };


function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800);
}
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }).toLowerCase();
function fmtDay(ts){
  const d=new Date(ts), t=new Date();
  const day0 = x => new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff = Math.round((day0(t)-day0(d))/86400000);
  if (diff===0) return 'Today';
  if (diff===1) return 'Yesterday';
  return d.toLocaleDateString([], { month:'short', day:'numeric', year: d.getFullYear()!==t.getFullYear() ? 'numeric' : undefined });
}
function joinDateOf(uuid){
  try {
    const raw = String(uuid || '').slice(2, 12);
    const ts = parseInt(raw, 36);
    if (ts > 1000000000) return new Date(ts).toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' });
  } catch(e){}
  return '—';
}

/* ---- unique ID system ---- */
const discOf = u => (u && u.disc) || (u && u.uuid ? u.uuid.slice(-4).toUpperCase() : '');
function findUserByMention(str){
  str = (str || '').trim();
  for (const u of Object.values(state.members)){
    if (u.name === str) return u;
    if ((u.name + '#' + discOf(u)) === str) return u;
    if (discOf(u) === str || u.uuid === str) return u;
  }
  return null;
}
const currentPartner = () => state.dmTarget ? state.members[state.dmTarget] || state.dms[state.dmTarget] : null;


const pnChannel = chatId => chatId.startsWith('dm-') ? DM_INBOX_CH : chatId.startsWith('vc-') ? chatId : 'c-' + chatId;
function publishChat(chatId, payload){
  const m = Object.assign({}, payload);
  if (chatId.startsWith('dm-')) m.to = dmPartnerOf(chatId);
  state.pubnub.publish({ channel: pnChannel(chatId), message: m }).catch(()=>{});
}

// ==================== markdown-lite ====================
function isKnownName(name){
  if (findUserByMention(name)) return true;
  for (const ch in state.messages)
    if (state.messages[ch].some(m => m.author === name)) return true;
  return false;
}
function parseInline(seg){
  let out = '';
  const parts = seg.split('`');
  for (let i=0;i<parts.length;i++){
    if (i % 2 === 1){ out += '<code class="inline">' + parts[i] + '</code>'; continue; }
    out += parts[i].split('\n').map(line => {
      if (/^&gt;/.test(line)) return '<blockquote>' + line.replace(/^&gt;\s?/, '') + '</blockquote>';
      line = line.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      line = line.replace(/@([\w#.\-]+)/g, (m,n) => {
        const known = isKnownName(n);
        return '<span class="mention' + (known ? ' known" data-mention="'+esc(n) : '') + '">@' + n + '</span>';
      });
      line = line.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      line = line.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
      return line;
    }).join('\n');
  }
  return out;
}
function parseContent(text){
  const parts = esc(text).split('```');
  let html = '';
  for (let i=0;i<parts.length;i++){
    if (i % 2 === 1) html += '<pre class="codeblock"><code>' + parts[i].replace(/^\n/, '') + '</code></pre>';
    else html += parseInline(parts[i]);
  }
  return html;
}


// ==================== PubNub ====================
function allPnChannels(){
  const chans = [PRESENCE_CH, DM_INBOX_CH, ACTIVITY_CH, OWNER_CH];
  for (const s of Object.values(serversData))
    for (const c of s.categories)
      for (const ch of c.channels)
        chans.push(ch.type === 'voice' ? 'vc-' + ch.id : pnChannel(ch.id));
  return chans;
}
function initPubNub(){
  state.pubnub = new PubNub({
    publishKey: DEMO_KEYS.publishKey,
    subscribeKey: DEMO_KEYS.subscribeKey,
    uuid: state.uuid,
    ssl: true
  });
  state.pubnub.addListener({
    status: s => { if (s.category === 'PNConnectedCategory') publishHello(); },
    message: ev => onMessage(ev),
    signal:  ev => onSignal(ev)
  });
  state.pubnub.subscribe({ channels: allPnChannels(), withPresence: false });
  publishHello();
  setTimeout(() => sendActivity({ type:'activity-query' }), 1200);
  setInterval(publishHello, 8000);
  setInterval(announceActivityRooms, 10000);
  setInterval(pruneMembers, 5000);
  setInterval(updateTitle, 5000);
  window.addEventListener('pagehide', () => { publishBye(); leaveAllVoice(); });
}
function publishHello(){
  if (!state.pubnub) return;
  state.pubnub.publish({ channel: PRESENCE_CH, message: {
    type:'hello', uuid:state.uuid, name:state.user.name, disc:state.user.disc,
    color:state.user.color, status:state.user.status, custom:state.user.custom || '', ts:Date.now(),
    coins:state.user.coins, plate:state.user.plate, bio:state.user.bio || '', stats:state.user.stats,
    avatar:state.user.avatar || null, avatarFx:state.user.avatarFx, messageSkin:state.user.messageSkin, nitro:state.user.nitro || false
  }}).catch(()=>{});
}
function publishBye(){
  if (!state.pubnub) return;
  state.pubnub.publish({ channel: PRESENCE_CH, message:{ type:'bye', uuid:state.uuid } }).catch(()=>{});
}


function onMessage(ev){
  const ch = ev.channel;
  if (ch === PRESENCE_CH) return onPresenceMessage(ev.message, ev.publisher);
  if (ch === DM_INBOX_CH) return onDmInbox(ev.message, ev.publisher);
  if (ch === ACTIVITY_CH) return onActivityMessage(ev.message, ev.publisher);
  if (ch === OWNER_CH) return onOwnerMessage(ev.message);
  if (ch.startsWith('c-'))  return onChatMessage(ch.slice(2), ev.message, ev.publisher);
  if (ch.startsWith('vc-')) return onVoiceMessage(ch.slice(3), ev.message, ev.publisher);
}

let banWatcher = null;
let kickCountdownTimer = null;
let abuseLockdown = false;

function applyAbuseTheme(theme){
  if (!['dark','light','midnight'].includes(theme)) return;
  SETTINGS.theme = theme;
  saveSettings();
  toast('☢ Owner forced the ' + theme + ' theme');
}
function abuseConfetti(count){
  const old = $('#abuse-confetti');
  if (old) old.remove();
  const wrap = el('abuse-confetti');
  wrap.id = 'abuse-confetti';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:240;pointer-events:none;overflow:hidden';
  const glyphs = ['🎉','✨','🪙','🔥','💎','⚡','🎊'];
  const total = Math.min(120, Math.max(8, Number(count) || 24));
  for (let i=0; i<total; i++){
    const s = document.createElement('span');
    s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    s.style.cssText = 'position:absolute;left:' + (Math.random()*100) + '%;top:-10%;font-size:' + (14+Math.random()*22) + 'px;animation:abuseDrop ' + (1.5+Math.random()*2) + 's ease-in forwards;animation-delay:' + (Math.random()*.4) + 's';
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 4200);
}
function showBanScreen(record){
  let screen = $('#ban-screen');
  if (!screen){
    screen = el('ban-screen');
    document.body.appendChild(screen);
  }
  screen.innerHTML = '<div class="ban-card"><div class="ban-icon">⛔</div><h2>You are banned from Nexus</h2><p>Your access has been revoked by the server owner.</p>' +
    (record.reason ? '<div class="ban-reason">Reason: ' + esc(record.reason) + '</div>' : '') +
    '<p style="font-size:12px;color:var(--muted)">Keep this page open while the owner reviews your ban. Access returns automatically if you are unbanned.</p></div>';
}
function watchForBanLift(uuid){
  if (banWatcher || !uuid) return;
  banWatcher = new PubNub({ publishKey:DEMO_KEYS.publishKey, subscribeKey:DEMO_KEYS.subscribeKey, uuid:'ban-watch-' + uuid, ssl:true });
  banWatcher.addListener({ message:event => {
    const m = event.message || {};
    const restoresAccess = m.action === 'unban-user' || m.action === 'end-kick';
    if (event.channel === OWNER_CH && m.type === 'owner-command' && restoresAccess && (m.to === uuid || m.to === '*')){
      if (m.action === 'unban-user') store.set(BAN_STORAGE_KEY, null);
      if (m.action === 'end-kick') store.set(KICK_STORAGE_KEY, null);
      const screen = $('#ban-screen');
      if (screen) screen.innerHTML = '<div class="ban-card"><div class="ban-icon">✅</div><h2>Ban lifted</h2><p>Your access has been restored. Reconnecting…</p></div>';
      setTimeout(() => location.reload(), 900);
    }
  }});
  banWatcher.subscribe({ channels:[OWNER_CH], withPresence:false });
}
function activateBan(reason){
  const record = { uuid:state.uuid, reason:String(reason || '').slice(0,240), at:Date.now() };
  store.set(BAN_STORAGE_KEY, record);
  if (state.pubnub){ publishBye(); state.pubnub.unsubscribeAll(); }
  showBanScreen(record);
  watchForBanLift(state.uuid);
}
function activeMute(){
  const record = store.get(MUTE_STORAGE_KEY, null);
  if (record && record.expiresAt && record.expiresAt > Date.now()) return record;
  if (record) store.set(MUTE_STORAGE_KEY, null);
  return null;
}
function activeKick(){
  const record = store.get(KICK_STORAGE_KEY, null);
  if (record && record.expiresAt && record.expiresAt > Date.now()) return record;
  if (record) store.set(KICK_STORAGE_KEY, null);
  return null;
}
function minutesRemaining(expiresAt){ return Math.max(1, Math.ceil((expiresAt - Date.now()) / 60000)); }
function updateMuteUI(){
  const composer = $('#composer'), input = $('#input');
  if (!composer || !input) return;
  const muted = activeMute();
  const locked = abuseLockdown && state.mode === 'server';
  let note = $('#mute-note');
  if (!muted && !locked){
    composer.classList.remove('is-muted'); input.disabled = false;
    $$('#composer button').forEach(button => button.disabled = false);
    if (note) note.remove();
    return;
  }
  composer.classList.add('is-muted'); input.disabled = true;
  $$('#composer button').forEach(button => button.disabled = true);
  input.placeholder = locked ? 'Owner lockdown is active' : 'You are muted for ' + minutesRemaining(muted.expiresAt) + ' more minute(s)';
  if (!note){
    note = el('mute-note'); note.id = 'mute-note';
    composer.insertBefore(note, composer.firstChild);
  }
  note.textContent = locked ? '🔒 Owner lockdown is active — chat is paused' : '🔇 Muted · ' + minutesRemaining(muted.expiresAt) + ' minute(s) remaining' + (muted.reason ? ' · ' + muted.reason : '');
}
function ensureCanChat(){
  if(state.mode==='server'){ const ch=findChan(state.activeChannel); if(ch&&ch.private&&!canViewChannel(state.activeServer,ch)){ toast('This is a private channel — you do not have access'); return false; } }
  if (abuseLockdown && state.mode === 'server'){
    updateMuteUI();
    toast('🔒 Nexus is in owner lockdown');
    return false;
  }
  const muted = activeMute();
  if (!muted) return true;
  updateMuteUI();
  toast('You are muted for ' + minutesRemaining(muted.expiresAt) + ' more minute(s)');
  return false;
}
function renderKickScreen(record){
  let screen = $('#ban-screen');
  if (!screen){ screen = el('ban-screen'); document.body.appendChild(screen); }
  screen.innerHTML = '<div class="ban-card"><div class="ban-icon">👢</div><h2>You were kicked from Nexus</h2><p>Access returns when your temporary kick ends.</p><div class="ban-reason" id="kick-time"></div>' +
    (record.reason ? '<p>Reason: ' + esc(record.reason) + '</p>' : '') + '</div>';
  if (kickCountdownTimer) clearInterval(kickCountdownTimer);
  const render = () => {
    const current = activeKick();
    if (!current){ clearInterval(kickCountdownTimer); location.reload(); return; }
    const timer = $('#kick-time'); if (timer) timer.textContent = minutesRemaining(current.expiresAt) + ' minute(s) remaining';
  };
  render(); kickCountdownTimer = setInterval(render, 1000);
}
function activateKick(minutes, reason){
  const safeMinutes = Math.max(1, Math.min(1440, Math.round(Number(minutes) || 1)));
  const record = { uuid:state.uuid, reason:String(reason || '').slice(0,240), expiresAt:Date.now() + safeMinutes * 60000 };
  store.set(KICK_STORAGE_KEY, record);
  if (state.pubnub){ publishBye(); state.pubnub.unsubscribeAll(); }
  renderKickScreen(record);
  watchForBanLift(state.uuid);
}
function applyMute(minutes, reason){
  const safeMinutes = Math.max(1, Math.min(1440, Math.round(Number(minutes) || 1)));
  store.set(MUTE_STORAGE_KEY, { uuid:state.uuid, reason:String(reason || '').slice(0,240), expiresAt:Date.now() + safeMinutes * 60000 });
  updateMuteUI();
  toast('🔇 You were muted for ' + safeMinutes + ' minute(s)');
}
function onOwnerMessage(m){
  if (!m || m.type !== 'owner-command') return;
  if (m.to !== state.uuid && m.to !== '*') return;
  if (m.action === 'ban-user'){ activateBan(m.reason); return; }
  if (m.action === 'unban-user'){
    store.set(BAN_STORAGE_KEY, null);
    const screen = $('#ban-screen'); if (screen) screen.remove();
    return;
  }
  if (m.action === 'kick-user'){ activateKick(m.minutes, m.reason); return; }
  if (m.action === 'end-kick'){ store.set(KICK_STORAGE_KEY, null); location.reload(); return; }
  if (m.action === 'mute-user'){ applyMute(m.minutes, m.reason); return; }
  if (m.action === 'unmute-user'){ store.set(MUTE_STORAGE_KEY, null); updateMuteUI(); toast('🔊 Your mute was lifted'); return; }
  const amount = Math.max(0, Math.min(100000, Number(m.amount) || 0));
  if (m.action === 'coin-rain' && amount){
    state.user.coins += amount;
    saveUserData(); broadcastProfile(); renderUserPanel();
    toast('☢ Coin rain: +' + amount + ' coins');
    return;
  }

function onDmInbox(m, publisher){
  if (!m || !m.type) return;
  const fromMe = publisher === state.uuid;
  let partner;
  if (fromMe) partner = m.to;
  else if (m.to === state.uuid) partner = m.uuid;
  else return;
  onChatMessage(dmChannel(partner), m, publisher);
}


function onChatMessage(chatId, m, publisher){
  if (!m || !m.type) return;
  const fromMe = publisher === state.uuid;


  if (chatId.startsWith('dm-') && !fromMe){
    const partner = dmPartnerOf(chatId);
    const existing = state.dms[partner];
    state.dms[partner] = {
      uuid: partner,
      name: (state.members[partner]||{}).name || m.author || (existing && existing.name) || 'User',
      disc: (state.members[partner]||{}).disc || m.disc || (existing && existing.disc) || partner.slice(-4).toUpperCase(),
      color: (state.members[partner]||{}).color || m.color || (existing && existing.color) || '#5865f2',
      plate: (state.members[partner]||{}).plate || m.plate || (existing && existing.plate) || 'none',
      nitro: (state.members[partner]||{}).nitro || m.nitro || (existing && existing.nitro) || false,
      avatar: (state.members[partner]||{}).avatar || (existing && existing.avatar) || null,
      avatarFx: (state.members[partner]||{}).avatarFx || (existing && existing.avatarFx) || 'none',
      messageSkin: (state.members[partner]||{}).messageSkin || m.messageSkin || (existing && existing.messageSkin) || 'none',
      lastTs: m.time || Date.now(),
      unread: existing ? existing.unread : 0
    };
  }


  switch (m.type){
    case 'message': {
      if (!state.messages[chatId]) state.messages[chatId] = [];
      if (fromMe && state.messages[chatId].some(x => x.id === m.id)) return;
      state.messages[chatId].push(m);
      if (!fromMe && m.kind === 'gift' && m.to === state.uuid && m.uuid !== state.uuid) creditIncomingGift(m);
      saveLocal();
      if (chatId === currentChatId()) appendMsg(m);
      else {
        state.unread[chatId] = (state.unread[chatId] || 0) + 1;
        if (chatId.startsWith('dm-')){
          const p = dmPartnerOf(chatId);
          if (state.dms[p]) state.dms[p].unread = (state.dms[p].unread || 0) + 1;
        }
        bumpSidebarBadges();
        if (!fromMe){
          if (m.kind === 'gift'){ playSound(); if (m.to !== state.uuid) toast('🎁 ' + m.author + ' sent a gift!'); updateTitle(); }
          else if (m.mentionsMe) notifyMention(m);
          else notifyMsg();
        }
      }
      updateTitle();
      break;
    }
    case 'edit': {
      const msg = findInChat(chatId, m.id);
      if (!msg || (fromMe && msg.content === m.content)) return;
      msg.content = m.content; msg.edited = true;
      const row = rowOf(m.id);
      if (row){ const c = row.querySelector('.content'); if (c) c.innerHTML = parseContent(m.content) + '<span class="edited-note"> (edited)</span>'; }
      saveLocal();
      break;
    }
    case 'delete': {
      if (state.messages[chatId]) state.messages[chatId] = state.messages[chatId].filter(x => x.id !== m.id);
      state.pins[chatId] = (state.pins[chatId] || []).filter(x => x !== m.id);
      const row = rowOf(m.id);
      if (row) row.remove();
      saveLocal();
      break;
    }
    case 'reaction': {
      const msg = findInChat(chatId, m.id);
      if (!msg || fromMe) return;
      applyReaction(msg, m.emoji, m.user.uuid);
      const row = rowOf(m.id);
      if (row){ const rr = row.querySelector('.reactions'); if (rr) renderReactions(msg, rr); }
      saveLocal();
      if (msg.uuid === state.uuid){
        state.user.coins += 2;
        state.user.stats.reactions = (state.user.stats.reactions || 0) + 1;
        saveUserData(); broadcastProfile(); renderUserPanel();
      }
      break;
    }
    case 'pin': {
      const msg = findInChat(chatId, m.id);
      if (!msg) return;
      state.pins[chatId] = state.pins[chatId] || [];
      if (m.pinned && !state.pins[chatId].includes(m.id)) state.pins[chatId].push(m.id);
      if (!m.pinned) state.pins[chatId] = state.pins[chatId].filter(x => x !== m.id);
      const row = rowOf(m.id);
      if (row){
        const p = row.querySelector('.pin-badge');
        if (m.pinned && !p && row.querySelector('.top')) row.querySelector('.top').insertAdjacentHTML('beforeend', '<span class="pin-badge">📌 Pinned</span>');
        if (!m.pinned && p) p.remove();
      }
      saveLocal();
      break;
    }
  }
}


function onVoiceMessage(vcId, m){
  if (!m) return;
  state.voice[vcId] = state.voice[vcId] || {};
  if (m.type === 'join'){
    state.voice[vcId][m.uuid] = { uuid:m.uuid, name:m.name, color:m.color };
    if (m.uuid !== state.uuid) publishVoice(vcId, { type:'roster', to:m.uuid, users:Object.values(state.voice[vcId]) });
    if (m.uuid !== state.uuid && state.voiceCall && state.voiceCall.kind === 'voice' && state.voiceCall.vcId === vcId) ensureVoicePeer(m.uuid);
  }
  if (m.type === 'roster' && m.to === state.uuid){ (m.users||[]).forEach(u=>{ state.voice[vcId][u.uuid]=u; if(u.uuid!==state.uuid&&state.voiceCall&&state.voiceCall.kind==='voice'&&state.voiceCall.vcId===vcId) ensureVoicePeer(u.uuid); }); }
  if (m.type === 'leave'){
    delete state.voice[vcId][m.uuid];
    if (state.voiceCall && state.voiceCall.kind === 'voice' && state.voiceCall.vcId === vcId) closeVoicePeer(m.uuid);
  }
  if (state.mode === 'server' && server().categories.some(c => c.channels.some(x => x.id === vcId))) renderChannelSidebar();
}


function onSignal(ev){
  const ch = ev.channel;
  const sig = ev.message;
  if (!sig) return;
  if (sig.uuid === state.uuid) return;
  if (['call-invite','call-accept','call-reject','call-busy','call-end','rtc-signal'].includes(sig.type)){
    handleCallSignal(ch, sig);
    return;
  }
  let chatId = null;
  if (ch.startsWith('c-')) chatId = ch.slice(2);
  else if (ch === DM_INBOX_CH){
    if (sig.to !== state.uuid) return;
    chatId = dmChannel(sig.from || sig.uuid);
  }
  if (!chatId || chatId !== currentChatId()) return;
  state.typing[sig.name] = Date.now();
  renderTyping();
}


function onPresenceMessage(m, publisher){
  if (!m || !m.type) return;
  if (publisher === state.uuid && m.type !== 'status') return;
  switch (m.type){
    case 'owner-presence-query':
      publishHello();
      break;
    case 'hello':
      state.members[m.uuid] = { uuid:m.uuid, name:m.name, disc:m.disc || m.uuid.slice(-4).toUpperCase(), color:m.color, status:m.status, custom:m.custom||'', ts:m.ts||Date.now(),
        coins:m.coins||0, plate:m.plate||'none', bio:m.bio||'', stats:m.stats||{messages:0,reactions:0},
        avatar:m.avatar||null, avatarFx:m.avatarFx||'none', messageSkin:m.messageSkin||'none', nitro:m.nitro||false };
      renderMembers(); renderChannelSidebar();
      break;
    case 'status': {
      const mem = state.members[m.uuid];
      if (mem){ mem.status = m.status; mem.custom = m.custom !== undefined ? m.custom : mem.custom; mem.ts = Date.now(); renderMembers(); renderChannelSidebar(); }
      break;
    }
    case 'profile': {
      const mem = state.members[m.uuid];
      if (mem){
        if (m.coins !== undefined) mem.coins = m.coins;
        if (m.plate !== undefined) mem.plate = m.plate;
        if (m.stats) mem.stats = m.stats;
        if (m.bio !== undefined) mem.bio = m.bio;
        if (m.avatar !== undefined) mem.avatar = m.avatar;
        if (m.avatarFx !== undefined) mem.avatarFx = m.avatarFx;
        if (m.messageSkin !== undefined) mem.messageSkin = m.messageSkin;
        if (m.nitro !== undefined) mem.nitro = m.nitro;
        mem.ts = Date.now();
        renderMembers(); renderChannelSidebar();
        if (state.mode === 'dm' && m.uuid === state.dmTarget) renderMessages();
        if (state.mode === 'dm') renderChatHeader();
      }
      break;
    }
    case 'server-name': {
      const s = serversData[m.serverId];
      if (s && m.name){ s.name = m.name; renderChannelSidebar(); renderServers(); }
      break;
    }
    case 'server-meta': {
      if (m.serverId && m.meta){ state.serverMeta[m.serverId]=m.meta; store.set('nexus-server-meta',state.serverMeta); renderServers(); renderChannelSidebar(); }
      break;
    }
    case 'server-role': {
      if (m.serverId && m.uuid && m.role){ const meta=state.serverMeta[m.serverId]||{roles:{}}; meta.roles=meta.roles||{}; meta.roles[m.uuid]=m.role; state.serverMeta[m.serverId]=meta; store.set('nexus-server-meta',state.serverMeta); renderMembers(); renderChannelSidebar(); }
      break;
    }
    case 'bye':
      delete state.members[m.uuid];
      renderMembers(); renderChannelSidebar();
      break;
    case 'server': {
      if (!serversData[m.server.id]){
        serversData[m.server.id] = m.server;
        if(m.server.owner) state.serverMeta[m.server.id]={owner:m.server.owner,roles:{[m.server.owner]:'owner'}};
        for (const c of m.server.categories) for (const ch of c.channels) state.pubnub.subscribe({ channels:[ch.type==='voice'?'vc-'+ch.id:pnChannel(ch.id)], withPresence:false });
        renderServers(); renderChannelSidebar();
        toast('New server created: ' + m.server.name);
      }
      break;
    }
    case 'channel': {
      const s = serversData[m.serverId];
      if (s && !s.categories.flatMap(c=>c.channels).some(ch => ch.id === m.channel.id)){
        (s.categories.find(c => c.name === 'Text Channels') || s.categories[0]).channels.push(m.channel);
        if (m.channel.private) (s.privateChannels=s.privateChannels||{})[m.channel.id]=m.channel;
        state.pubnub.subscribe({ channels:[pnChannel(m.channel.id)], withPresence:false });
        renderChannelSidebar();
        toast('New channel: #' + m.channel.name);
      }
      break;
    }
  }
}


function pruneMembers(){
  const n = Date.now(); let changed = false;
  for (const k in state.members){
    if (n - state.members[k].ts > 25000){ delete state.members[k]; changed = true; }
  }
  if (changed) renderMembers();
}


// ==================== reactions ====================
function applyReaction(msg, emoji, uuid){
  msg.reactions = msg.reactions || {};
  const r = msg.reactions[emoji];
  if (!r){ msg.reactions[emoji] = { count:1, users:[uuid] }; }
  else if (r.users.includes(uuid)){ r.users = r.users.filter(u=>u!==uuid); r.count--; if (r.count<=0) delete msg.reactions[emoji]; }
  else { r.users.push(uuid); r.count++; }
}
function toggleReaction(msg, emoji){
  applyReaction(msg, emoji, state.uuid);
  const row = rowOf(msg.id);
  if (row){ const rr = row.querySelector('.reactions'); if (rr) renderReactions(msg, rr); }
  publishChat(currentChatId(), { type:'reaction', id:msg.id, emoji, user:{ uuid:state.uuid } });
}


// ==================== actions ====================
function sendMessage(){
  if (!ensureCanChat()) return;
  const ta = $('#input');
  const text = ta.value.trim();
  if (!text && !state.pendingAttaches.length) return;
  const chatId = currentChatId();
  const mentionsMe = state.user.name ? new RegExp('@' + esc(state.user.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?:#' + esc(state.user.disc) + ')?', 'i').test(text) : false;


  let attachments = state.pendingAttaches.length ? state.pendingAttaches.slice() : undefined;
  if (attachments && attachments.length){
    while (JSON.stringify({ content:text, attachments }).length > MAX_PAYLOAD && attachments.length > 1) attachments.pop();
    if (JSON.stringify({ content:text, attachments }).length > MAX_PAYLOAD){
      toast('Message too large for PubNub (32KB cap) — attach fewer/smaller images');
      return;
    }
  }


  const m = {
    type:'message', id: uid(), uuid: state.uuid, author: state.user.name, disc: state.user.disc, color: state.user.color,
    plate: state.user.plate, messageSkin: state.user.messageSkin, nitro: state.user.nitro || false, content: text, time: Date.now(), edited:false,
    replyToName: state.replyTo ? state.replyTo.name : null,
    attachments, reactions: {}, mentionsMe
  };
  if (!state.messages[chatId]) state.messages[chatId] = [];
  state.messages[chatId].push(m);
  appendMsg(m);
  publishChat(chatId, m);


  state.user.coins += 15;
  state.user.stats.messages = (state.user.stats.messages || 0) + 1;
  saveUserData(); broadcastProfile(); renderUserPanel();


  state.replyTo = null; state.pendingAttaches = [];
  updateReplyBar(); updateAttachBar();
  ta.value = ''; autoGrow(); saveLocal();
}


/* ---- rich sends: stickers / GIFs / gifts ---- */
function sendRich(kind, extra){
  if (!ensureCanChat()) return;
  const chatId = currentChatId();
  const m = {
    type:'message', kind, id: uid(), uuid: state.uuid, author: state.user.name, disc: state.user.disc, color: state.user.color,
    plate: state.user.plate, messageSkin: state.user.messageSkin, nitro: state.user.nitro || false, content:'', time: Date.now(), edited:false,
    replyToName: state.replyTo ? state.replyTo.name : null,
    reactions:{}, mentionsMe:false
  };
  Object.assign(m, extra);
  if (!state.messages[chatId]) state.messages[chatId] = [];
  state.messages[chatId].push(m);
  appendMsg(m);
  publishChat(chatId, m);
  state.replyTo = null;
  updateReplyBar();
  saveLocal();
  $('#input').focus();
}
function sendSticker(emoji){ sendRich('sticker', { sticker: emoji }); }
function sendGif(g){ sendRich('gif', { sticker: g.emoji, effect: g.effect, gifName: g.name }); }
function creditIncomingGift(m){
  const receiptId = String(m.id || (m.uuid + ':' + m.time + ':' + ((m.gift || {}).name || 'gift')));
  if (state.giftReceipts[receiptId]) return;
  const gift = m.gift || {};
  const amount = Math.max(0, Math.min(100000, Math.floor(Number(gift.coins !== undefined ? gift.coins : gift.price) || 0)));
  if (!amount) return;
  state.giftReceipts[receiptId] = Date.now();
  const receiptIds = Object.keys(state.giftReceipts);
  if (receiptIds.length > 1000) delete state.giftReceipts[receiptIds.sort((a,b) => state.giftReceipts[a] - state.giftReceipts[b])[0]];
  store.set('nexus-gift-receipts', state.giftReceipts);
  state.user.coins += amount;
  saveUserData(); broadcastProfile(); renderUserPanel();
  const bal = $('#gf-coins'); if (bal) bal.textContent = state.user.coins;
  toast('🎁 ' + (m.author || 'Someone') + ' sent you 🪙 ' + amount + ' coins!');
}
function sendGift(g, target){
  if (!target || !target.uuid){ toast('Choose someone to receive this gift first'); return; }
  if (target.uuid === state.uuid){ toast('Choose someone else — you cannot gift yourself'); return; }

// ==================== profile picture (free) ====================
function loadAvatarImage(file, cb){
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const isPng = (file.type || '').toLowerCase().includes('png');
      let maxDim = 128, q = 0.72, out = null;
      for (let i = 0; i < 4; i++){
        const cv = document.createElement('canvas');
        cv.width = maxDim; cv.height = maxDim;
        const ctx = cv.getContext('2d');
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, maxDim, maxDim);
        out = cv.toDataURL(isPng ? 'image/png' : 'image/jpeg', q);
        if (out.length <= AV_MAX) break;
        maxDim = Math.round(maxDim * 0.72); q = Math.max(0.5, q - 0.1);
      }
      cb(out && out.length <= AV_MAX ? out : null);
    };
    img.onerror = () => cb(null);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function pickAvatarFile(cb){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/gif,image/*';
  input.onchange = () => {
    const f = input.files && input.files[0];
    if (f) loadAvatarImage(f, cb);
    input.remove();
  };
  input.click();
}


// ==================== image upload (chat attachments) ====================
function prepareImage(file){
  return new Promise(resolve => {
    const type = (file.type || '').toLowerCase();
    const isSvg = type.includes('svg');
    if (file.size <= 16000 || isSvg){
      const r = new FileReader();
      r.onload = () => resolve({ data: r.result, name: file.name, type: file.type });
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const outPng = type.includes('png') || type.includes('gif') || type.includes('webp');
        const fmt = outPng ? 'image/png' : 'image/jpeg';
        let maxDim = 720, q = 0.68, out = null;
        for (let attempt = 0; attempt < 5; attempt++){
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.width * scale));
          cv.height = Math.max(1, Math.round(img.height * scale));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          out = cv.toDataURL(fmt, q);
          if (out.length <= MAX_PAYLOAD) break;
          maxDim = Math.round(maxDim * 0.6); q = Math.max(0.35, q - 0.12);
        }
        resolve(out && out.length <= MAX_PAYLOAD ? { data: out, name: file.name, type } : null);
      };
      img.onerror = () => {
        if (file.size <= 16000){
          const r = new FileReader();
          r.onload = () => resolve({ data: r.result, name: file.name, type: file.type });
          r.readAsDataURL(file);
        } else resolve(null);
      };
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
function attachFiles(files){
  const imgs = [...files].filter(f => (f.type || '').startsWith('image/'));
  if (!imgs.length){ toast('Only images are supported: PNG, JPG, GIF, WebP, SVG'); return; }
  Promise.all(imgs.map(prepareImage)).then(atts => {
    const ok = atts.filter(Boolean);
    const dropped = atts.length - ok.length;
    if (!ok.length){ toast('That image was too large for PubNub (32KB cap)'); return; }
    const room = Math.max(0, MAX_ATTACH - state.pendingAttaches.length);
    const add = ok.slice(0, room);
    state.pendingAttaches = state.pendingAttaches.concat(add);
    updateAttachBar();
    const droppedTotal = dropped + (ok.length - add.length);
    toast(add.length + ' image' + (add.length>1?'s':'') + ' attached — Enter to send' + (droppedTotal ? ' (' + droppedTotal + ' skipped)' : ''));
    $('#input').focus();
  });
}
function updateAttachBar(){
  const bar = $('#attach-bar');
  const list = state.pendingAttaches;
  if (!list.length){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML =
    '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">' +
    list.map((a,i) =>
      '<div class="att-item"><img src="' + a.data + '" alt=""><button class="att-x" data-i="' + i + '" title="Remove">' + ICONS.close + '</button><span class="att-name">' + esc(a.name) + '</span></div>'
    ).join('') +
    '<span class="att-bar-hint">↩ send</span></div>';
  $$('.att-x', bar).forEach(b => {
    b.onclick = () => {

    };
  });

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 720; g.gain.value = 0.045;
    o.connect(g); g.connect(ctx.destination); o.start();
    o.stop(ctx.currentTime + 0.09);
    setTimeout(() => ctx.close(), 400);
  } catch(e){}
}

  if (!call || !sig) return false;
  if (sig.scope === 'dm') return call.kind === 'dm' && call.callId === sig.callId && call.peer === sig.from;
  return call.kind === 'voice' && call.vcId === sig.room;

  const historyBtn = el('chan'); historyBtn.innerHTML = '<span class="icon" style="color:#2dc770">◷</span><span class="name">Call history</span>'; historyBtn.onclick = () => openCallHistory(); list.appendChild(historyBtn);
  const resetBtn = el('chan');
  resetBtn.innerHTML = '<span class="icon" style="color:var(--red)">⟲</span><span class="name">Reset DMs</span>';
  resetBtn.onclick = () => resetDMs();
  list.appendChild(resetBtn);
  const filter = $('#dm-filter');
  if (filter){
    filter.value = state.memberFilter;
    filter.oninput = e => { state.memberFilter = e.target.value; renderDmSidebar(); };
  }
  Object.values(state.dms).sort((a,b) => (b.lastTs||0)-(a.lastTs||0)).forEach(c => {
    if (state.memberFilter && !c.name.toLowerCase().includes(state.memberFilter.toLowerCase())) return;
    const row = el('convo' + (state.dmTarget === c.uuid ? ' active' : ''));
    const mem = state.members[c.uuid];
    const color = (mem && mem.color) || c.color || '#5865f2';
    const name = (mem && mem.name) || c.name || 'User';
    row.innerHTML = avatarHTML(name, color, '', (mem && mem.avatar) || c.avatar, fxClass(c)) +
      '<div style="min-width:0"><div class="mname"><span style="' + plateOf(c).css + '">' + esc(name) + '</span></div><div style="font-size:11px;color:var(--muted-dark)">#' + esc(discOf(c)) + '</div></div>' +
      ((c.unread||0) ? '<span class="badge">' + c.unread + '</span>' : '');
    row.onclick = () => openDM(c.uuid);
    list.appendChild(row);
  });
  if (!Object.keys(state.dms).length && !state.memberFilter){
    const n = el('empty-note'); n.textContent = 'No conversations yet — click "Start a conversation" above.'; list.appendChild(n);
  }
  renderUserPanel();
}

      };

      if (ns !== null){
        state.user.custom = ns.trim();
        if (state.members[state.uuid]) state.members[state.uuid].custom = state.user.custom;
        state.pubnub.publish({ channel: PRESENCE_CH, message:{ type:'status', uuid:state.uuid, status:state.user.status, custom:state.user.custom } }).catch(()=>{});

function renderShopGrid(){
  const grid = $('#sh-grid');
  if (!grid) return;
  grid.innerHTML = '';
  PLATES.forEach(p => {
    const owned = p.id === 'none' || (state.user.ownedPlates || []).includes(p.id) || state.user.nitro;
    const equipped = state.user.plate === p.id;
    let btn;
    if (equipped) btn = '<button class="btn sh-btn" disabled>Equipped ✓</button>';
    else if (owned) btn = '<button class="btn sh-btn" data-act="equip" data-id="' + p.id + '">Equip</button>';
    else if (state.user.coins >= p.price) btn = '<button class="btn primary sh-btn" data-act="buy" data-id="' + p.id + '">Buy — 🪙 ' + p.price + '</button>';
    else btn = '<button class="btn sh-btn" disabled>🪙 ' + p.price + ' needed</button>';
    const card = el('shop-card' + (equipped ? ' eq' : ''));
    card.innerHTML =
      '<div class="sh-preview"><span style="' + p.css + '">' + esc(state.user.name || 'Your Name') + '</span></div>' +
      '<div class="sh-name">' + p.name + '</div><div class="sh-price">🪙 ' + p.price + '</div>' + btn;
    grid.appendChild(card);
  });
  $$('.sh-btn', grid).forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id, act = b.dataset.act;
      const plate = PLATE_MAP[id];
      if (act === 'buy'){
        if (state.user.coins >= plate.price){
          state.user.coins -= plate.price;
          state.user.ownedPlates = state.user.ownedPlates || [];
          state.user.ownedPlates.push(id);
          state.user.plate = id;
          toast('Bought & equipped: ' + plate.name);
        }
      } else if (act === 'equip'){
        state.user.plate = id;
        toast('Equipped: ' + plate.name);

      saveUserData(); broadcastProfile();
      renderUserPanel(); renderMembers(); renderChannelSidebar(); renderMessages();
      const bal = $('#sh-coins'); if (bal) bal.textContent = state.user.coins;
      renderShopGrid();
    };
  });

function renderMembers(){
  const box = $('#member-list');
  box.innerHTML = '<div class="mem-section"><span>ONLINE</span><span class="mcount">' + Object.keys(state.members).length + '</span></div>';
  const q = (state.memberFilter || '').toLowerCase();
  Object.values(state.members)
    .filter(m => !q || m.name.toLowerCase().includes(q) || (m.custom||'').toLowerCase().includes(q) || discOf(m).toLowerCase().includes(q) || m.uuid.toLowerCase().includes(q))
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(u => box.appendChild(memberRow(u)));
  if (!box.querySelector('.member')) box.innerHTML += '<div class="empty-note">No members match.</div>';
}
function memberRow(u){
  const row = el('member');
  const st = u.status==='idle'?'idle':u.status==='dnd'?'dnd':u.status==='offline'?'off':'';
  const role=state.mode==='server'?roleOf(state.activeServer,u.uuid):'member';
  row.innerHTML = avatarHTML(u.name, u.color, '', u.avatar, fxClass(u)) +
    '<div style="min-width:0"><div class="mname"><span style="' + plateOf(u).css + '">' + esc(u.name) + '</span>' + nitroBadge(u) + '<span class="mdisc">#' + esc(discOf(u)) + '</span>' + (role!=='member'?'<span class="role-badge">'+esc(role)+'</span>':'') + '</div>' +
    (u.custom ? '<div class="mstatus">' + esc(u.custom) + '</div>' : '') + '</div>';
  const av = row.querySelector('.avatar'); av.style.position = 'relative';
  av.insertAdjacentHTML('beforeend', '<span class="status-dot ' + st + '"></span>');
  row.onclick = () => openProfile(u.uuid);
  row.title = isFriend(u.uuid) ? 'Friend · click to view profile' : 'Click to view profile';
  return row;
}

function openSearch(){
  closeModal();
  const f = modalFrame('Search messages', '<button class="btn" id="sr-close">Close</button>');
  f.body.innerHTML = '<input class="search-input" id="sr-q" placeholder="Search all channels and DMs…" autocomplete="off"><div id="sr-results"></div>';
  const res = $('#sr-results');
  const run = debounce(q => {
    if (!q){ res.innerHTML = '<div class="empty-note">Type to search. <span class="kbd">⌘K</span> opens this.</div>'; return; }
    res.innerHTML = '';
    let count = 0;
    const lower = q.toLowerCase();
    for (const chatId in state.messages){
      for (const m of state.messages[chatId]){
        if (m.content && m.content.toLowerCase().includes(lower)){
          const label = chatId.startsWith('dm-') ? '@' + ((state.dms[dmPartnerOf(chatId)]||{}).name) : '#' + ((findChan(chatId)||{}).name || chatId);
          const r = el('s-result');
          r.innerHTML = '<div class="s-chat">' + esc(label) + '</div><div class="s-text"><span style="' + plateOf(m).css + '">' + esc(m.author) + '</span>: ' + esc(m.content.slice(0,60)) + '</div><div class="s-time">' + esc(m.author) + '#' + esc(discOf(m)) + ' • ' + fmtTime(m.time) + '</div>';
          r.onclick = () => jumpToChat(chatId, m.id);
          res.appendChild(r);
          if (++count >= 30) break;
        }
      }
      if (count >= 30) break;
    }
    if (!count) res.innerHTML = '<div class="empty-note">No results for "' + esc(q) + '".</div>';
  }, 200);
  $('#sr-q').oninput = e => run(e.target.value);
  $('#sr-close').onclick = () => f.back.remove();
  setTimeout(() => $('#sr-q').focus(), 50);
  run('');
}

$('#messages').addEventListener('click', e => {
  const img = e.target.closest('.att');
  if (img){ openLightbox(img.src); return; }
  const men = e.target.closest('[data-mention]');
  if (men){
    const mem = findUserByMention(men.dataset.mention);
    if (mem) openProfile(mem.uuid);
    return;
  }
  const row = e.target.closest('.msg');
  if (!row) return;
  const chatId = currentChatId();
  const m = (state.messages[chatId] || []).find(x => x.id === row.dataset.id);
  if (!m) return;
  const contentEl = row.querySelector('.content');


  if (e.target.closest('.react-btn')) openReactionPicker(m, e.target.closest('.react-btn'));
  else if (e.target.closest('.reply-btn')) startReplyTo(m);
  else if (e.target.closest('.pin-btn')) togglePin(m);
  else if (e.target.closest('.edit-btn')) startEdit(m, contentEl);
  else if (e.target.closest('.del-btn')) deleteMessage(chatId, m.id, row);
  else if (e.target.closest('.more-btn')){
    closePop();
    const r = e.target.closest('.more-btn').getBoundingClientRect();
    const pop = el('pop');
    pop.style.top = r.bottom + 6 + 'px';
    pop.style.right = (window.innerWidth - r.right) + 'px';
    if (m.uuid === state.uuid){
      if (m.content) pop.appendChild(popItem(ICONS.edit, 'Edit', () => startEdit(m, contentEl)));
      pop.appendChild(popItem(ICONS.trash, 'Delete', () => deleteMessage(chatId, m.id, row), 'danger'));
    }
    pop.appendChild(popItem(ICONS.reply, 'Reply', () => startReplyTo(m)));
    pop.appendChild(popItem(ICONS.pin, (state.pins[chatId]||[]).includes(m.id) ? 'Unpin' : 'Pin', () => togglePin(m)));
    pop.appendChild(popItem(ICONS.copy, 'Copy text', () => copyText(m.content || (m.kind === 'gift' ? 'Gift: ' + (m.gift||{}).name : (m.sticker || '')))));
    document.body.appendChild(pop);
  }
});

}
ta.addEventListener('input', () => {
  autoGrow();
  const n = Date.now();
  if (n - state.lastTypingSent > 2000){
    state.lastTypingSent = n;
    const chatId = currentChatId();
    const sig = { uuid:state.uuid, name:state.user.name, from:state.uuid };
    if (chatId.startsWith('dm-')) sig.to = dmPartnerOf(chatId);
    state.pubnub.signal({ channel: pnChannel(chatId), message: sig }).catch(()=>{});
  }
});
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});


ta.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const it of items){
    if (it.type && it.type.startsWith('image/') && it.getAsFile()) files.push(it.getAsFile());
  }
  if (files.length){
    e.preventDefault();
    attachFiles(files);
  }
});


// ==================== drag & drop upload ====================
['#messages', '#composer'].forEach(sel => {
  const z = $(sel);
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('drag-over'); });
  z.addEventListener('dragleave', () => z.classList.remove('drag-over'));
  z.addEventListener('drop', e => {
    e.preventDefault(); z.classList.remove('drag-over');
    if (e.dataTransfer && e.dataTransfer.files.length) attachFiles(e.dataTransfer.files);
  });
});


// ==================== attach buttons ====================
$('#plus-btn').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.accept = 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/*';
  input.onchange = () => { if (input.files.length) attachFiles(input.files); input.remove(); };
  input.click();
};


let emojiCat = Object.keys(EMOJI_CATS)[0];
$('#emoji-btn').onclick = e => {
  e.stopPropagation(); closePop();
  const r = $('#emoji-btn').getBoundingClientRect();
  const pop = el('pop');
  pop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
  pop.style.right = (window.innerWidth - r.right) + 'px';
  pop.style.minWidth = '240px';
  const cats = el('emoji-cats');
  const rowE = el('emoji-row'); rowE.style.flexWrap = 'wrap'; rowE.style.maxWidth = '240px';
  Object.keys(EMOJI_CATS).forEach(k => {
    const b = el('em' + (k === emojiCat ? ' on' : ''));
    b.textContent = EMOJI_CATS[k][0];
    b.title = k;
    b.onclick = () => { emojiCat = k; renderEmojis(); };
    cats.appendChild(b);
  });
  pop.appendChild(cats); pop.appendChild(rowE);
  document.body.appendChild(pop);
  function renderEmojis(){
    rowE.innerHTML = '';
    EMOJI_CATS[emojiCat].forEach(em => {
      const b = el('em'); b.textContent = em;
      b.onclick = () => { ta.value += em; autoGrow(); ta.focus(); };
      rowE.appendChild(b);
    });
    $$('.emoji-cats .em', cats).forEach(x => x.classList.toggle('on', x.textContent === EMOJI_CATS[emojiCat][0]));
  }
  renderEmojis();
};
$('#gif-btn').onclick = () => openGifPicker();
$('#sticker-btn').onclick = () => openStickerPicker();


document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); openSettings(); }
});


// ==================== helpers ====================
function findInChat(chatId, id){ return (state.messages[chatId] || []).find(x => x.id === id); }
function rowOf(id){ return $('#messages').querySelector('.msg[data-id="' + id + '"]'); }
function bumpSidebarBadges(){ if (state.mode === 'server') renderChannelSidebar(); else renderDmSidebar(); }


// ==================== login ====================
let picked = 0;
try {
  const prof = store.get('nexus-profile', null);
  if (prof && prof.name){ $('#login-name').value = prof.name; picked = Math.max(0, AV_COLORS.indexOf(prof.color)); }
} catch(e){}
function renderAvatarPick(){
  const box = $('#avatar-pick');
  box.innerHTML = '';
  AV_COLORS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === picked ? ' sel' : '');
    d.style.background = c;
    d.onclick = () => { picked = i; renderAvatarPick(); };
    box.appendChild(d);
  });
}
renderAvatarPick();


let loginBonus = false;
$('#login-btn').onclick = () => {
  const name = ($('#login-name').value.trim() || 'Guest_' + Math.floor(Math.random()*1000)).slice(0, 16);
  state.user.name = name; state.user.color = AV_COLORS[picked]; state.user.status = 'online';
  let uuid = localStorage.getItem('nexus-uuid');
  if (!uuid){
    uuid = 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('nexus-uuid', uuid);
  }
  state.uuid = uuid;
  state.user.disc = uuid.slice(-4).toUpperCase();

  const activeBan = store.get(BAN_STORAGE_KEY, null);
  if (activeBan && activeBan.uuid === uuid){
    showBanScreen(activeBan);
    watchForBanLift(uuid);
    return;
  }


  const ud = store.get('nexus-user-data', null);
  if (ud){
    state.user.coins = ud.coins !== undefined ? ud.coins : START_COINS;
    state.user.plate = ud.plate || 'none';
    state.user.ownedPlates = ud.ownedPlates || ['none'];
    state.user.stats = ud.stats || { messages:0, reactions:0 };
    state.user.bio = ud.bio || '';
    state.user.avatar = ud.avatar || null;
    state.user.avatarFx = ud.avatarFx || 'none';
    state.user.ownedFx = ud.ownedFx || ['none'];
    state.user.messageSkin = ud.messageSkin || 'none';
    state.user.ownedSkins = ud.ownedSkins || ['none'];
    state.user.nitro = ud.nitro || false;
    const today = new Date().toDateString();
    if (ud.lastLogin !== today){ state.user.coins += (state.user.nitro ? 50 : 25); loginBonus = true; }
  } else {
    state.user.coins = START_COINS; state.user.plate = 'none'; state.user.ownedPlates = ['none'];
    state.user.stats = { messages:0, reactions:0 }; state.user.bio = '';
    state.user.avatar = null; state.user.avatarFx = 'none'; state.user.ownedFx = ['none'];
    state.user.messageSkin = 'none'; state.user.ownedSkins = ['none'];
    state.user.nitro = false;
    loginBonus = true;
  }


  store.set('nexus-profile', { name, color: state.user.color });
  saveUserData();
  state.messages = store.get('nexus-msgs', {});
  state.pins = store.get('nexus-pins', {});
  state.dms = store.get('nexus-dms', {});


  const btn = $('#login-btn');
  btn.disabled = true; btn.textContent = 'Connecting…';
  initPubNub();
  applySettings();


  const login = $('#login');
  login.style.transition = 'opacity .3s'; login.style.opacity = '0';
  setTimeout(()=>{
    login.classList.add('hidden');
    const app = $('#app');
    app.classList.remove('hidden'); app.classList.add('fade-in');
    renderServers(); renderChannelSidebar(); renderMembers();
    renderChatHeader(); renderMessages(); updateReplyBar(); updateAttachBar();
    updateMuteUI();
    toast('Connected! You are ' + state.user.name + '#' + state.user.disc + ' — share that ID so friends can find you');
    if (loginBonus) setTimeout(() => toast('Daily login bonus: +25 🪙'), 3000);
    $('#input').focus();
  }, 400);
};
$('#login-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-btn').click(); });


// ==================== theme / settings ====================
function applySettings(){
  document.body.classList.remove('theme-light','theme-midnight');
  if (SETTINGS.theme === 'light') document.body.classList.add('theme-light');
  if (SETTINGS.theme === 'midnight') document.body.classList.add('theme-midnight');
  document.documentElement.style.setProperty('--accent', SETTINGS.accent);
  document.body.classList.toggle('compact', SETTINGS.compact);
}
applySettings();


// ==================== boot ====================
renderServers();
</script>
